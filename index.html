<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7db7e8" />
    <title>360 草原天空 MVP</title>
    <script type="module" crossorigin src="/VR_test/assets/index-D3DU7dk8.js"></script>
    <link rel="stylesheet" crossorigin href="/VR_test/assets/index-DAvK66Ce.css">
  </head>
  <body>
    <main id="app" aria-label="360 草原天空場景">
      <canvas id="scene"></canvas>
      <div class="crosshair" aria-hidden="true">
        <span></span>
      </div>
      <div id="interactionPrompt" class="interactionPrompt" aria-live="polite" hidden>
        <span class="keyboardPrompt">按 <kbd>F</kbd> 檢視</span>
        <button id="inspectButton" class="inspectButton" type="button">檢視</button>
      </div>
      <section
        id="dialogueBox"
        class="dialogueBox"
        aria-labelledby="dialogueSpeaker"
        aria-live="polite"
        hidden
      >
        <div class="dialogueHeader">
          <p id="dialogueSpeaker" class="dialogueSpeaker">校園大使</p>
          <button id="dialogueCloseButton" class="dialogueIconButton" type="button" aria-label="關閉對話">
            ×
          </button>
        </div>
        <p id="dialogueText" class="dialogueText"></p>
        <div class="dialogueActions">
          <button id="dialogueNextButton" class="dialogueNextButton" type="button">下一句</button>
        </div>
      </section>
      <div class="hud" aria-live="polite">
        <p id="hint">拖曳或轉動手機觀看四周</p>
        <button id="gyroButton" type="button" hidden>啟用陀螺儀</button>
      </div>
    </main>
  </body>
</html>
